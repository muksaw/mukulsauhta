<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mukul Sauhta</title>
  <link rel="icon" type="image/png" href="/assets/img/favicon-32x32.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="{{ "/assets/css/custom.css" | relative_url }}">
</head>
<body>
  <div class="site">
    <header class="site-header">
      <h1 class="site-name"><a href="/">Mukul Sauhta</a></h1>
      <p class="site-tagline">Software &amp; Data Engineer &middot; M.S. CS @ NC State</p>
      <div class="contact-links">
        <a href="mailto:{{ site.email }}"><i class="fas fa-envelope"></i> Email</a>
        <a href="https://www.linkedin.com/in/{{ site.linkedin_username }}" target="_blank"><i class="fab fa-linkedin"></i> LinkedIn</a>
        <a href="https://github.com/{{ site.github_username }}" target="_blank"><i class="fab fa-github"></i> GitHub</a>
        <span class="location"><i class="fas fa-map-marker-alt"></i> Raleigh, NC</span>
      </div>
    </header>

    <main class="site-content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <p>Hosted on GitHub Pages</p>
    </footer>
  </div>

  <div class="lightbox" id="lightbox">
    <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
    <img id="lightbox-img" src="" alt="Project image">
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var sections = document.querySelectorAll('.accordion-section');

      sections.forEach(function (section) {
        var body = section.querySelector('.section-body');
        body.style.maxHeight = '0';

        section.querySelector('.section-toggle').addEventListener('click', function () {
          var isOpen = section.classList.contains('open');

          // Close all sections
          sections.forEach(function (s) {
            s.classList.remove('open');
            s.querySelector('.section-body').style.maxHeight = '0';
            s.querySelector('.section-toggle').setAttribute('aria-expanded', 'false');
          });

          // Open this one if it was closed
          if (!isOpen) {
            section.classList.add('open');
            body.style.maxHeight = body.scrollHeight + 'px';
            section.querySelector('.section-toggle').setAttribute('aria-expanded', 'true');
          }
        });
      });

      // Open About by default
      var about = document.getElementById('about');
      if (about) {
        about.classList.add('open');
        var aboutBody = about.querySelector('.section-body');
        aboutBody.style.maxHeight = aboutBody.scrollHeight + 'px';
        about.querySelector('.section-toggle').setAttribute('aria-expanded', 'true');
      }

      // Lightbox background click
      document.getElementById('lightbox').addEventListener('click', function (e) {
        if (e.target !== document.getElementById('lightbox-img')) closeLightbox();
      });
    });

    function openLightbox(src) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox').style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      document.getElementById('lightbox').style.display = 'none';
      document.body.style.overflow = '';
    }

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeLightbox();
    });
  </script>
</body>
</html>
