<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mukul Sauhta</title>
  <link rel="icon" type="image/png" href="/assets/img/favicon-32x32.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="{{ "/assets/css/custom.css" | relative_url }}">
</head>
<body>
  <div class="site">
    <header class="site-header">
      <div class="header-row">
        <h1 class="site-name"><a href="/">Mukul Sauhta</a></h1>
        <button class="theme-btn" id="theme-btn" aria-label="Toggle theme">
          <i class="fas fa-sun" id="theme-icon"></i>
          <span id="theme-label">Light</span>
        </button>
      </div>
      <p class="site-tagline">Software &amp; Data Engineer &middot; M.S. CS @ NC State</p>
      <div class="contact-links">
        <a href="mailto:{{ site.email }}"><i class="fas fa-envelope"></i> Email</a>
        <a href="https://www.linkedin.com/in/{{ site.linkedin_username }}" target="_blank"><i class="fab fa-linkedin"></i> LinkedIn</a>
        <a href="https://github.com/{{ site.github_username }}" target="_blank"><i class="fab fa-github"></i> GitHub</a>
        <span class="location"><i class="fas fa-map-marker-alt"></i> Raleigh, NC</span>
      </div>
    </header>

    <main class="site-content">
      {{ content }}
    </main>
  </div>

  <div class="lightbox" id="lightbox">
    <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
    <img id="lightbox-img" src="" alt="Project image">
  </div>

  <script>
    // ── Theme ──────────────────────────────────────────────────────────
    var THEMES = [
      { id: 'light', icon: 'fa-sun',                label: 'Light' },
      { id: 'grey',  icon: 'fa-circle-half-stroke', label: 'Grey'  },
      { id: 'dark',  icon: 'fa-moon',               label: 'Dark'  },
    ];
    var themeIdx = 0;

    function applyTheme(id) {
      var t = THEMES.find(function(x){ return x.id === id; });
      if (!t) return;
      document.documentElement.setAttribute('data-theme', id);
      var icon  = document.getElementById('theme-icon');
      var label = document.getElementById('theme-label');
      if (icon)  icon.className = 'fas ' + t.icon;
      if (label) label.textContent = t.label;
      themeIdx = THEMES.indexOf(t);
    }

    // Apply saved theme before paint to prevent flash
    (function() {
      var saved = localStorage.getItem('portfolio-theme') || 'light';
      applyTheme(saved);
    })();

    function cycleTheme() {
      themeIdx = (themeIdx + 1) % THEMES.length;
      applyTheme(THEMES[themeIdx].id);
      localStorage.setItem('portfolio-theme', THEMES[themeIdx].id);
    }

    // ── Tab switching ──────────────────────────────────────────────────
    function initTabs() {
      var btns   = Array.from(document.querySelectorAll('.tab-btn'));
      var panels = Array.from(document.querySelectorAll('.tab-panel'));
      btns.forEach(function(btn) {
        btn.addEventListener('click', function() {
          btns.forEach(function(b) { b.classList.remove('active'); });
          panels.forEach(function(p) { p.classList.remove('active'); });
          btn.classList.add('active');
          var panel = document.getElementById('tab-' + btn.dataset.tab);
          if (panel) panel.classList.add('active');
        });
      });
    }

    // ── Project pill accordion ─────────────────────────────────────────
    function initPillGroup(pills) {
      pills.forEach(function(pill) {
        var header = pill.querySelector(':scope > .pill-header');
        if (!header) return;
        header.addEventListener('click', function(e) {
          e.stopPropagation();
          var isOpen = pill.classList.contains('open');
          pills.forEach(function(p) {
            p.classList.remove('open');
            var h = p.querySelector(':scope > .pill-header');
            if (h) h.setAttribute('aria-expanded', 'false');
          });
          if (!isOpen) {
            pill.classList.add('open');
            header.setAttribute('aria-expanded', 'true');
          }
        });
      });
    }

    // Script is at bottom of <body> — DOM is ready
    (function() {
      initTabs();
      document.querySelectorAll('.projects-grid').forEach(function(grid) {
        initPillGroup(Array.from(grid.querySelectorAll(':scope > .project-pill')));
      });
      var btn = document.getElementById('theme-btn');
      if (btn) btn.addEventListener('click', cycleTheme);
      var lb = document.getElementById('lightbox');
      if (lb) lb.addEventListener('click', function(e) {
        if (e.target !== document.getElementById('lightbox-img')) closeLightbox();
      });
    })();

    // ── Lightbox ───────────────────────────────────────────────────────
    function openLightbox(src) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox').style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
      document.getElementById('lightbox').style.display = 'none';
      document.body.style.overflow = '';
    }
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeLightbox();
    });
  </script>
</body>
</html>
